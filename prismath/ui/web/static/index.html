<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prismath · 数学模型可视化</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>≋</text></svg>">
</head>
<body>
  <!-- 顶部栏：门户 / 模型页共用 -->
  <header class="topbar" id="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M3 7h6M3 12h9M3 17h5M12 7h9M15 12h6M11 17h10"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>prismath</strong>

      </span>

    <nav class="topbar-actions" id="topbarActions"></nav>

  <!-- 主体：由 app.js 渲染门户页或模型页 -->
  <main id="view" class="view" aria-live="polite"></main>

  <footer class="footer">
    <span>纯前端 Canvas 渲染 · 计算由本地 Python 服务提供 · 全部运行在本机</span>
    <span id="footerMeta"></span>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="app.js"></script>
